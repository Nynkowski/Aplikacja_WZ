version: '3.8'

services:
  database_mysql:
    image: mysql:8.4
    container_name: Wystawiane_wz_db
    restart: always


    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_NAME: ${MYSQL_NAME}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    
    ports:
      - "${LOCAL_PORT}:3306"
    
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: